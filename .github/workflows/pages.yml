name: Pages

# Publishes site/ to plugins.richardadleta.com. The directory is generated by
# scripts/site-build.mjs in radleta/claude-code-ref and committed here by the
# publish; nothing in this workflow builds it, so a deploy can only ever ship
# bytes that were reviewed before they were committed.
#
# CNAME lives inside site/ and is regenerated on every build, so a deploy that
# replaces the whole directory cannot drop the custom domain.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - .github/workflows/pages.yml
  workflow_dispatch:

# The default GITHUB_TOKEN grant carries none of these, and deploy-pages fails at
# runtime without pages: write and id-token: write. Declared at the job level
# rather than the workflow level: this is the one workflow in a public repo under
# Richard's name that holds id-token: write, and only the deploy job needs it.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Without this the job's GITHUB_TOKEN is left in .git/config for every
          # later step. Nothing here needs it: the job checks out, verifies and
          # uploads. contents: read bounds the damage, but this is the cheap
          # default on the one workflow in a public repo that holds id-token.
          persist-credentials: false

      - name: Fail if site/ is missing
        run: |
          set -euo pipefail
          test -f site/index.html || { echo "site/index.html not found — nothing to deploy"; exit 1; }
          test -f site/CNAME || { echo "site/CNAME not found — the custom domain would be dropped"; exit 1; }

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
